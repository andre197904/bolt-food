:root{

*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:400 1rem/1.6 var(--font);background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:6px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0}
.logo{font:800 1.15rem var(--display);display:flex;align-items:center;gap:.5rem;text-decoration:none}
.logo i{width:1.9rem;height:1.9rem;border-radius:.6rem;background:var(--green);display:grid;place-items:center;color:var(--green-ink);font-style:normal;font-size:1rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:500 .8rem var(--font);border:0;background:none;color:var(--muted);padding:.4rem .85rem;border-radius:999px;cursor:pointer;min-height:2.2rem}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center;padding:3rem 0 4rem}
h1{font:800 clamp(2rem,5vw,3.6rem)/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin-top:1.25rem;color:var(--muted);max-width:34rem;font-size:1.08rem}
.ticket{position:relative;background:var(--deep);color:#eef5ef;border-radius:1.5rem;padding:2rem 1.75rem 1.75rem;
  -webkit-mask:radial-gradient(circle 14px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 14px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket small{color:#9bb0a4;font-size:.85rem}
.amount{font:800 clamp(3.4rem,8vw,5rem)/1 var(--display);color:var(--green);margin:.4rem 0 1.4rem}
.tear{border-top:2px dashed #2c4437;margin:0 -1.75rem 1.4rem}
.code{display:flex;gap:.6rem;align-items:stretch;flex-wrap:wrap}
.code output{flex:1;min-width:10rem;font:800 1.7rem/1 var(--display);letter-spacing:.08em;color:var(--amber);background:#06100b;border-radius:.9rem;padding:1rem;text-align:center;user-select:all}
.btn{font:700 1rem var(--font);border:0;border-radius:.9rem;padding:.95rem 1.4rem;cursor:pointer;background:var(--green);color:var(--green-ink);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:.5rem;min-height:3rem;transition:transform .15s,background .15s}
.btn:hover{background:#34d884}.btn:active{transform:scale(.97)}
.live{min-height:1.4rem;font-size:.9rem;color:var(--green);margin-top:.7rem}
section{padding:3rem 0}
h2{font:800 clamp(1.4rem,3vw,2rem)/1.2 var(--display);letter-spacing:-.01em;margin-bottom:2rem;max-width:30rem}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem;margin-bottom:2.5rem;max-width:34rem}
.track span{height:.7rem;border-radius:99px;background:var(--line)}
.track span:nth-child(-n+10){background:var(--green)}
.track span:last-child{background:var(--amber)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--ink);padding-top:1rem}
.steps li::before{content:counter(s);font:800 1.6rem var(--display);color:var(--green)}
.steps h3{font:700 1.05rem var(--font);margin:.4rem 0 .3rem}
.steps p{color:var(--muted);font-size:.95rem}
.cta{text-align:center;padding:2rem 0}
.cta .btn{font-size:1.15rem;padding:1.15rem 2.2rem}
.cta p{color:var(--muted);font-size:.85rem;margin-top:.8rem}

.vehicle h2{margin:0}.vehicle p{color:var(--muted)}
.mode{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.mode span{border:1px solid var(--line);border-radius:99px;padding:.35rem .9rem;font-size:.9rem}
details{border-bottom:1px solid var(--line);padding:1rem 0;max-width:42rem}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::after{content:"+";color:var(--green);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:.6rem}
footer{border-top:1px solid var(--line);margin-top:2rem;padding:2rem 0 2.5rem;color:var(--muted);font-size:.85rem}
footer p+p{margin-top:.4rem}
.reveal{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media (max-width:820px){
  .hero,.vehicle{grid-template-columns:1fr;gap:2rem}
  .steps{grid-template-columns:1fr 1fr}

@media (max-width:480px){.steps{grid-template-columns:1fr}}

.scenes{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:2rem}

.scene div{padding:1.25rem 1.5rem 1.5rem}
.scene h3{font:800 1.15rem var(--display);margin-bottom:.4rem}

.ben div{background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1.4rem}
.ben svg{width:2.6rem;height:2.6rem;margin-bottom:.9rem}
.ben h3{font:700 1.05rem var(--font);margin-bottom:.25rem}
.ben p{color:var(--muted);font-size:.93rem}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;position:relative}
.journey::before{content:"";position:absolute;top:2.1rem;left:16%;right:16%;border-top:3px dashed var(--line)}
.journey div{text-align:center;position:relative}
.journey svg{width:4.2rem;height:4.2rem;background:var(--deep);border-radius:50%;padding:.9rem;margin-bottom:1rem}
.journey h3{font:700 1.05rem var(--font)}
.journey p{color:var(--muted);font-size:.93rem;max-width:16rem;margin:.3rem auto 0}
.end{background:var(--deep);color:#eef5ef;border-radius:2rem;padding:3.5rem 2rem;text-align:center;position:relative;overflow:hidden}

.end .btn{font-size:1.1rem;padding:1.1rem 2rem}
.end svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;opacity:.5;pointer-events:none}
.end>*:not(svg){position:relative}
@media (max-width:820px){.scenes{grid-template-columns:1fr}.ben{grid-template-columns:1fr 1fr}.journey{grid-template-columns:1fr}.journey::before{display:none}}

@media (prefers-reduced-motion:reduce){.dot{animation:none}.reveal{animation:none}.btn{transition:none}}
</style>

const $=s=>document.querySelector(s);
let cur='ru';
function setLang(l){
  if(!T[l])l='ru';cur=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
  document.documentElement.lang=l==='est'?'et':l;
  document.title=T[l].h1+' | Bolt Food';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#copy').onclick=async()=>{
  const t=$('#code').textContent;
  try{await navigator.clipboard.writeText(t)}catch(e){
    const r=document.createRange();r.selectNode($('#code'));getSelection().removeAllRanges();getSelection().addRange(r);
    try{document.execCommand('copy')}catch(_){}
  }
  $('#live').textContent=T[cur].copied;
  setTimeout(()=>$('#live').textContent='',3000);
};

/* ---- Live counters ----
   FB_URL пустой  -> работает бесплатный Abacus без регистрации (приблизительно)
   FB_URL заполнен -> работает Firebase Realtime Database (точнее, см. инструкцию) */
(function(){
  const START=1562;   // стартовое число к реальным посещениям (0 = убрать)
  const FB_URL='';    // пример: https://ВАШ-ПРОЕКТ-default-rtdb.europe-west1.firebasedatabase.app
  const fmt=n=>n.toLocaleString(document.documentElement.lang||'ru');
  const showTotal=v=>{$('#cTotal').textContent=fmt((Number(v)||0)+START)};
  const showOnline=n=>{$('#cOnline').textContent=fmt(Math.max(1,n||1))};
  const seen=()=>{try{return sessionStorage.getItem('counted')}catch(e){}};
  const mark=()=>{try{sessionStorage.setItem('counted','1')}catch(e){}};
  showTotal(0);showOnline(1);               /* стартовое число видно сразу, даже если сервис не ответил */
  const JSONH={'Content-Type':'application/json'};

  if(FB_URL){
    const fb=FB_URL.replace(/\/$/,'');
    const j=async(path,opt)=>{const r=await fetch(fb+path,opt);if(!r.ok)throw new Error(r.status);return r.json()};
    const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    let off=null;
    const total=async()=>{
      try{
        if(!seen()){await j('/stats/total.json',{method:'PUT',headers:JSONH,body:JSON.stringify({'.sv':{increment:1}})});mark();}
        showTotal(await j('/stats/total.json'));
      }catch(e){}
    };
    const beat=async()=>{
      if(document.visibilityState!=='visible')return;
      try{
        await j('/presence/'+id+'.json',{method:'PUT',headers:JSONH,body:JSON.stringify({t:{'.sv':'timestamp'}})});
        if(off===null)off=(await j('/presence/'+id+'/t.json'))-Date.now();
        const q=encodeURIComponent('"t"');
        const o=await j('/presence.json?orderBy='+q+'&startAt='+(Date.now()+off-70000));
        showOnline(Object.keys(o||{}).length);
      }catch(e){}
    };
    const cleanup=async()=>{
      try{
        const q=encodeURIComponent('"t"');
        const old=await j('/presence.json?orderBy='+q+'&endAt='+(Date.now()-600000)+'&limitToFirst=20');
        for(const k of Object.keys(old||{}))fetch(fb+'/presence/'+k+'.json',{method:'DELETE'});
      }catch(e){}
    };
    total();beat();cleanup();
    setInterval(beat,25000);
    document.addEventListener('visibilitychange',beat);
    addEventListener('pagehide',()=>{try{fetch(fb+'/presence/'+id+'.json',{method:'DELETE',keepalive:true})}catch(e){}});
    return;
  }

  /* --- по умолчанию: Abacus (abacus.jasoncameron.dev), без регистрации --- */
  const API='https://abacus.jasoncameron.dev/',NS='bolt-courier-bonus-raa5d74';
  const call=async(key,act)=>{
    try{const r=await fetch(API+(act==='up'?'hit/':'get/')+NS+'/'+key,{cache:'no-store'});
        if(r.status===404)return 0;if(!r.ok)throw 0;
        const d=await r.json();return Number(d.value)||0;}
    catch(e){return null}
  };
  const minute=()=>Math.floor(Date.now()/60000);
  let hit='',cur=0;
  (async()=>{const v=await call('total',seen()?'':'up');mark();if(v!=null)showTotal(v)})();
  const tick=async()=>{
    if(document.visibilityState!=='visible')return;
    const b='m'+minute();
    if(hit!==b){hit=b;const c=await call(b,'up');cur=c==null?1:c}
    const prev=await call('m'+(minute()-1));
    showOnline(Math.max(1,cur,prev||0));
  };
  tick();setInterval(tick,30000);
  document.addEventListener('visibilitychange',tick);
})();
$('#year').textContent=new Date().getFullYear();
let saved;try{saved=localStorage.getItem('lang')}catch(e){}
const nav=(navigator.language||'ru').toLowerCase();
setLang(saved||(nav.startsWith('et')?'est':nav.startsWith('ru')?'ru':nav.startsWith('en')?'en':'ru'));
</script>
